<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title, description, canonical, og:*, twitter:*, robots:
         NO van aquí — cada página los inyecta individualmente vía React Helmet (data-rh).
         Ponerlos aquí duplica las etiquetas en el HTML final del SSG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fuentes Lato: preload de los 3 pesos críticos para eliminar font-swap y reflow.
         Deben ir ANTES del CSS para ganar la carrera de descarga.
         crossorigin es obligatorio en preload de fuentes aunque sean same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/lato-latin-400-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/lato-latin-700-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/lato-latin-900-normal.woff2" crossorigin>
    <!-- LCP hero image preload: tells browser to fetch before JS executes -->
    <link rel="preload" as="image" href="/images/hero-adeslas-seguros-medicos.webp" fetchpriority="high" type="image/webp" />
    <!-- HubSpot network hints:
         · js.hs-scripts.com → preconnect: el tracker carga con async/defer
           muy pronto; la conexión TCP+TLS estará caliente cuando arranque.
         · api.hsforms.com   → dns-prefetch SOLO (no preconnect): este dominio
           solo se usa al enviar un formulario, nunca en la carga inicial.
           Un preconnect expiraría antes de usarse y PageSpeed lo puntúa negativo.
         · El resto: dns-prefetch (resolución DNS sin TCP/TLS adicional). -->
    <link rel="preconnect" href="https://js.hs-scripts.com">
    <link rel="dns-prefetch" href="https://api.hsforms.com">
    <link rel="dns-prefetch" href="https://js.hs-analytics.net">
    <link rel="dns-prefetch" href="https://js.hscollectedforms.net">
    <link rel="dns-prefetch" href="https://js.hs-banner.com">
    <link rel="dns-prefetch" href="https://js.hsadspixel.net">

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Google Tag Manager: deferred to end of body so it never blocks render -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-M6ZDN42');</script>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M6ZDN42"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- HubSpot tracking pixel (portal 6596944)
         Genera la cookie hubspotutk necesaria para:
         · vincular form submissions con la sesión del visitante
         · asociar clics de Google Ads (hs_google_click_id) automáticamente
         · registrar page views en el timeline del contacto en HubSpot
         async + defer: no bloquea render ni LCP -->
    <script type="text/javascript" id="hs-script-loader" async defer src="//js.hs-scripts.com/6596944.js"></script>
  </body>
</html>
